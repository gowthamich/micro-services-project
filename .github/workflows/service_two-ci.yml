name: service_two CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:

  build-test-docker:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service_two

    steps:

      # --------------------------------
      # 1. Checkout source code
      # --------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # --------------------------------
      # 2. Setup Python
      # --------------------------------
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'


      # --------------------------------
      # 3. Check Python version
      # --------------------------------
      - name: Check Python version
        run: python --version


      # --------------------------------
      # 4. Install dependencies
      # --------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r service_two/requirements.txt


      # --------------------------------
      # 5. Run tests
      # --------------------------------
      - name: Run tests
        run: pytest -v


      # --------------------------------
      # 6. Login to Docker Hub
      # --------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # --------------------------------
      # 7. Build Docker image
      # --------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/service_two:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/service_two:latest \
            .


      # --------------------------------
      # 8. Verify Docker image
      # --------------------------------
      - name: List Docker images
        run: docker images


      # --------------------------------
      # 9. Push SHA tagged image
      # --------------------------------
      - name: Push image with commit SHA
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/service_two:${{ github.sha }}


      # --------------------------------
      # 10. Push latest image
      # --------------------------------
      - name: Push latest image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/service_two:latest
